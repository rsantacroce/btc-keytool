name: Build

# Builds the CLI and the desktop app for every platform.
# - pull requests and pushes to main: binaries are attached to the run as artifacts
# - a tag like v0.2.0: the same binaries, plus SHA256SUMS.txt, go into a draft GitHub release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: cli (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, selftest: true }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, selftest: true }
          - { os: macos-latest, target: aarch64-apple-darwin, selftest: true }
          - { os: macos-latest, target: x86_64-apple-darwin, selftest: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, selftest: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # release builds (tags) start from a clean tree, never from a cache
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p btc-keytool --target ${{ matrix.target }}
      - name: Self-test the release binary
        if: matrix.selftest
        run: cargo run --release --locked -p btc-keytool --target ${{ matrix.target }} -- selftest
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar -czf btc-keytool-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release btc-keytool
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/btc-keytool.exe -DestinationPath btc-keytool-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: btc-keytool-${{ matrix.target }}.*
          if-no-files-found: error

  app:
    name: app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-x86_64, args: "--bundles deb,appimage" }
          - { os: macos-latest, name: macos-universal, args: "--target universal-apple-darwin --bundles app,dmg" }
          - { os: windows-latest, name: windows-x86_64, args: "--bundles nsis" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      # release builds (tags) start from a clean tree, never from a cache
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          key: app-${{ matrix.name }}
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: tauri-cli@2.11.0
      - run: cargo tauri build ${{ matrix.args }} -- --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.name }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, app]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Collect files and write checksums
        run: |
          mkdir dist
          find artifacts -type f -exec mv {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # signed statement that these exact files were built by this workflow from this commit;
      # check one with: gh attestation verify <file> --repo rsantacroce/btc-keytool
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          generate_release_notes: true
          files: dist/*

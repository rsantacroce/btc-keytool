[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
bitcoin = { version = "0.32", features = ["base64", "rand-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
# amounts are money: an arithmetic overflow must stop the program, not wrap
overflow-checks = true
opt-level = 3
lto = true
strip = true

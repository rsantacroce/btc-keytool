# Windows (MSVC) only: two gaps in the bitcoinconsensus crate's build script, which compiles a
# bundled copy of Bitcoin Core's script interpreter and libsecp256k1.
#
# 1. It builds libsecp256k1 as a static library without defining SECP256K1_STATIC for the C++
#    that calls it, so MSVC emits DLL imports (__imp_secp256k1_*) and the link fails (LNK2019).
# 2. It leaves out libsecp256k1's ElligatorSwift module, which Core's pubkey.cpp refers to.
#    Other linkers discard the unused caller; MSVC's wants the symbol resolved.
[env]
CXXFLAGS_x86_64_pc_windows_msvc = "/DSECP256K1_STATIC"
CXXFLAGS_aarch64_pc_windows_msvc = "/DSECP256K1_STATIC"
CFLAGS_x86_64_pc_windows_msvc = "/DENABLE_MODULE_ELLSWIFT"
CFLAGS_aarch64_pc_windows_msvc = "/DENABLE_MODULE_ELLSWIFT"
